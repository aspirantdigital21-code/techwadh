
baseURL = "https://techwadh.in/"
title = "TechWadh"
theme = "PaperMod"
enableRobotsTXT = true

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[permalinks]
  posts = "/:slug/"

[params]
  images = ["images/techwadh-share.jpg"]
  author = "TechWadh Editorial Team"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowToc = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowAllPagesInArchive = true
  displayFullLangName = true
  
[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  threshold = 0.25
  ignoreLocation = true
  minMatchCharLength = 2
  keys = [{ name = "title", weight = 3 }, { name = "keywords", weight = 2 }, { name = "summary", weight = 1 }, { name = "content", weight = 0.5 }]

[languages.en]
  label = "English"
  locale = "en-IN"
  weight = 1
  contentDir = "content/en"
  title = "TechWadh"

  [[languages.en.menus.main]]
    name = "Home"
    url = "/"
    weight = 1

  [[languages.en.menus.main]]
    name = "Search"
    url = "/search/"
    weight = 2

[languages.hi]
  label = "हिन्दी"
  locale = "hi"
  weight = 2
  contentDir = "content/hi"
  title = "TechWadh"

  [[languages.hi.menus.main]]
    name = "होम"
    url = "/hi/"
    weight = 1

  [[languages.hi.menus.main]]
    name = "खोजें"
    url = "/hi/search/"
    weight = 2
