{{- $hi := eq .Page.Language.Lang "hi" -}}
<p class="tw-table-hint">{{ cond $hi "पूरी तालिका देखने के लिए बगल में स्क्रॉल करें।" "Scroll sideways if the table does not fit." }}</p>
<div class="tw-table-scroll" tabindex="0" role="region" aria-label="{{ cond $hi "लेख की तालिका" "Article table" }}">
  <table>
    <thead>
      {{- range .THead }}
      <tr>
        {{- range . }}
        <th scope="col"{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>
        {{- end }}
      </tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
      <tr>
        {{- range . }}
        <td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>
        {{- end }}
      </tr>
      {{- end }}
    </tbody>
  </table>
</div>
