name: Site checks
on: [pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: '0.170.1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" |
            tar -xz -C "$RUNNER_TEMP" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build and check production
        run: |
          CF_PAGES_BRANCH=main bash build.sh
          python3 scripts/check_site.py public
          grep -q 'index, follow' public/index.html
      - name: Check preview indexing
        run: |
          CF_PAGES_BRANCH=preview CF_PAGES_URL=https://preview.example.invalid/ bash build.sh
          grep -q 'noindex, nofollow' public/index.html
          grep -q 'noindex, nofollow' public/hi/index.html
